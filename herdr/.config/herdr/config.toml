onboarding = false
[theme]
name = "tokyo-night"
auto_switch = false

[terminal]
new_cwd = "follow"

[session]
resume_agents_on_restore = true

[ui]
mouse_capture = true
mouse_scroll_lines = 3

[keys]
prefix = "ctrl+b"

toggle_sidebar = "prefix+\\"

# workspace picker
goto = "prefix+s"

reload_config = "prefix+shift+r" # already herdr's default, kept explicit
split_horizontal = "prefix+h"
split_vertical = "prefix+v"
