# DankMono is a paid font not every machine has; JetBrains Mono Nerd Font
# (installed by the setup scripts) is the safe default everywhere. Unlike
# Ghostty, kitty has no in-file fallback list for font_family, so a machine
# that does have DankMono gets it via an untracked, machine-local
# font-local.conf (e.g. `font_family DankMono Nerd Font`) -- globinclude
# silently no-ops when that file doesn't exist.
font_family JetBrainsMono Nerd Font
globinclude font-local.conf
font_size 18.0

include tokyonight_night.conf

shell_integration no-cursor no-title
cursor_shape block
adjust_line_height 135%

wheel_scroll_multiplier 2.0

# macOS only; no-ops elsewhere
hide_window_decorations titlebar-only
macos_colorspace displayp3
macos_option_as_alt yes
